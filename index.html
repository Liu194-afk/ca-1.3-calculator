<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Arithmetic Calculator</title>
  <link rel="stylesheet" href="calculator.css">
</head>
<body>
  <main class="calculator">
    <h1>Basic Calculator</h1>
    <p>Enter two numbers and choose an operation.</p>

    <label for="firstNumber">First number</label>
    <input type="number" id="firstNumber" step="any" required>

    <label for="secondNumber">Second number</label>
    <input type="number" id="secondNumber" step="any" required>

    <div class="buttons">
      <button type="button" id="addButton">Add</button>
      <button type="button" id="subtractButton">Subtract</button>
      <button type="button" id="multiplyButton">Multiply</button>
      <button type="button" id="divideButton">Divide</button>
    </div>

    <p id="result" class="result">The result will appear here.</p>
  </main>

  <script src="calculator.js"></script>
</body>
</html>
